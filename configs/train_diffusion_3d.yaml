# Configuration for 3D Diffusion Model Training
# Image-to-fMRI Generation

# Model Configuration
model:
  type: "DiffusionARM3D"
  vis_dim: 768  # DINOv2 ViT-L/14 features
  fmri_dim: 15724  # Number of voxels
  time_dim: 512  # Time embedding dimension (increased for stronger conditioning)
  base_channels: 32  # Base channels for 3D U-Net (increased for more capacity)
  
# Diffusion Configuration
diffusion:
  timesteps: 50  # Number of diffusion steps during training
  inference_timesteps: 25  # DDIM fast sampling steps (increased for better quality)
  beta_schedule: "cosine"  # cosine or linear
  clip_value: 1.0  # Clip predicted x_0
  eta: 0.0  # DDIM stochasticity (0=deterministic, 1=DDPM)

# Classifier-Free Guidance Configuration
cfg:
  dropout: 0.15  # Probability of dropping visual conditioning during training (increased for better CFG)
  inference_scale: 4.0  # CFG scale during inference (1.0=no guidance, 2-5=recommended)

# Dataset Configuration
dataset:
  fmri_path: "/home/sowwn/Workspace/ws/2026/I2fMRI/dataset/nsd/subj01/betas_all_subj01_fp32_renorm.hdf5"
  image_dir: "/home/sowwn/Workspace/ws/2026/I2fMRI/dataset/nsd/images"
  visual_features_path: "/home/sowwn/Workspace/ws/2026/I2fMRI/dataset/nsd/subj01/visual_features_dinov2.npy"
  mean_fmri_path: "/home/sowwn/Workspace/ws/2026/I2fMRI/dataset/nsd/subj01/mean_fmri.npy"
  preload_fmri: false  # Set to true if you have enough RAM
  
# Training Configuration
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_epochs: 5
  gradient_clip: 1.0
  
  # Peak-Focused Loss Configuration
  # Thiết kế cho fMRI: phạt nặng khi sai ở vùng Peak (activation cao)
  loss:
    type: "peak_focused"  # Options: "peak_focused", "simple"
    # Peak-Focused Loss parameters
    alpha: 2.0             # Peak amplification factor (higher = more focus on peaks)
    tau: 0.3               # Threshold to identify peaks (normalized deviation)
    pearson_weight: 0.2    # Correlation shape matching (reduced to prioritize diversity)
    std_weight: 0.5        # Within-sample amplitude matching
    diversity_weight: 3.0  # Cross-sample diversity (increased: anti-collapse is critical!)
    l1_weight: 0.05        # L1 sparsity regularization (reduced)

  # Legacy loss weights (used when loss.type = "simple")
  loss_weights:
    mse: 1.0
    pearson: 0.5
    l1: 0.3
  
  # Optimizer
  optimizer: "AdamW"
  betas: [0.9, 0.999]
  eps: 0.00000001
  
  # Learning rate scheduler
  scheduler: "cosine"  # cosine, step, or plateau
  min_lr: 0.000001
  
  # Mixed precision training
  use_amp: true
  
  # Gradient accumulation
  accumulation_steps: 1

# Validation Configuration
validation:
  val_interval: 1  # Validate every N epochs
  num_samples: 2  # Number of samples to generate for visualization
  save_predictions: true

# Checkpoint Configuration
checkpoint:
  save_dir: "/home/sowwn/Workspace/ws/2026/I2fMRI/checkpoints/diffusion_3d"
  save_interval: 2  # Save every N epochs
  keep_last_n: 1  # Keep only last N checkpoints
  save_best: true  # Save best model based on validation loss

# Logging Configuration
logging:
  log_dir: "/home/sowwn/Workspace/ws/2026/I2fMRI/logs/diffusion_3d"
  log_interval: 10  # Log every N iterations
  use_wandb: false  # Set to true to use Weights & Biases
  wandb_project: "I2fMRI"
  wandb_entity: null

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 8
  pin_memory: true
  deterministic: false  # Set to true for reproducibility
  seed: 42

# Inference Configuration
inference:
  checkpoint_path: null  # Path to checkpoint for inference
  output_dir: "/home/sowwn/Workspace/ws/2026/I2fMRI/outputs/diffusion_3d"
  batch_size: 8
  num_samples_per_image: 1  # Generate N samples per image
  save_format: "npy"  # npy or hdf5
