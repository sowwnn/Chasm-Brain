# FlowARM Configuration (Flow Matching Version)

experiment:
  name: "flow_arm"
  version: "v1_matching"
  seed: 42
  save_dir: "outputs"

model:
  name: "FlowARM"
  input_dim: 768
  output_dim: 1000
  hidden_dim: 1024         # Giảm để tránh overfitting
  num_layers: 6            
  num_heads: 8             
  dropout: 0.4             # Tăng dropout mạnh mẽ

  flow:
    sample_steps: 20       
    sigma: 0.3             # Thêm nhiễu vào x_t trong lúc train

  loss:
    type: "FlowMatchingLoss"
    alpha: 2.5             
    tau: 0.5
    pearson_weight: 0.7    

data:
  datalist_path: "dataset/nsd/metadata/datalist_mindeye2_sub01.json"
  fmri_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm.hdf5"
  train_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_train_sub01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_test_sub01.npy"
  subjects: [1]
  batch_size: 32           
  num_workers: 4
  augment_noise_train: true
  noise_std: 0.15          
  use_parcellation: true
  parcel_labels_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm_kmeans1000_labels.npy"

training:
  max_epochs: 100
  lr: 1.0e-4             
  weight_decay: 0.01     
  precision: "16-mixed"
  gradient_clip_val: 1.0
  scheduler: "cosine"    # Or "plateau"

validation:
  early_stopping_patience: 15

logging:
  visualize: true
  viz_every_n_epochs: 1
  viz_num_samples: 3

hardware:
  accelerator: "gpu"
