# ARMNet with Parcellation (1000 parcels)

experiment:
  name: "armnet_parcellated"
  version: "v1"
  seed: 42
  save_dir: "outputs"

model:
  name: "ARMNet"
  input_dim: 768
  output_dim: 1000  # Will be auto-detected from parcellation
  hidden_dim: 2048
  loss:
    type: "PeakFocusedLoss"
    alpha: 3.0
    tau: 0.5
    pearson_weight: 0.5

data:
  datalist_path: "dataset/nsd/metadata/datalist_subj01.json"
  fmri_path: "dataset/nsd/mindeye2_preprocessed/subj01/preprocessed_data.hdf5"
  train_embeddings_path: "dataset/nsd/embeddings_mindeye2/train_embeddings_subj01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_mindeye2/test_embeddings_subj01.npy"
  subjects: [1]
  batch_size: 64  # Larger batch with parcellation
  num_workers: 4
  augment_noise_train: true
  noise_std: 0.1
  use_parcellation: true
  parcel_labels_path: "dataset/nsd/metadata/parcel_labels_1000_subj01.npy"

training:
  max_epochs: 100
  lr: 2.0e-4  # Higher LR with parcellation
  weight_decay: 1.0e-5
  precision: "16-mixed"
  gradient_clip_val: 1.0

validation:
  monitor: "val/pearson"
  save_top_k: 3
  early_stopping_patience: 15

logging:
  logger: "tensorboard"
  log_every_n_steps: 10
  visualize: true
  viz_every_n_epochs: 1
  viz_num_samples: 3

hardware:
  accelerator: "gpu"
  devices: 1
