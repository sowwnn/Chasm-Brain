# Config file mẫu cho HUWNG dataset với HierarchicalARM V3

model:
  name: "HierarchicalARM_V31"
  cls_dim: 768
  patch_dim: 768
  num_patches: 256
  fmri_dim: 15724
  voxels_per_cluster: 30
  hidden_dim_1: 512
  depth_what: 2
  depth_where: 4
  contrastive_dim: 256
  embed_dim_2: 384
  depth_2: 6
  num_global_queries: 128
  dropout: 0.4

training:
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.01
  max_epochs: 450
  precision: "fp16"
  save_dir: "checkpoints/hierarchical_v3_huwng_subj01"
  stage: 1
  stage_1_epochs: 150
  viz_interval: 5
  grad_clip: 0.5
  use_scheduler: true
  warmup_epochs: 15
  scheduler_type: "cosine"
  early_stopping: true
  patience: 20

loss:
  alpha: 2.0
  tau: 0.2
  pearson_weight: 0.3
  contrastive_weight: 0.2
  std_weight: 0.2
  peak_alpha: 0.5
  peak_tau: 0.3

data:
  subject: 1
  
  # === HUWNG Dataset Configuration ===
  # Thay thế datalist_path và fmri_path bằng huwng_base_path
  huwng_base_path: "dataset/huwng"
  
  # Embeddings paths (giữ nguyên như cũ)
  train_embeddings_path: "dataset/nsd/embeddings_patches/dinov2_patches_train_sub01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_patches/dinov2_patches_test_sub01.npy"
  
  # Image IDs cho embedding order (optional)
  train_image_ids_path: "dataset/nsd/embeddings_patches/image_ids_train_sub01.npy"
  test_image_ids_path: "dataset/nsd/embeddings_patches/image_ids_test_sub01.npy"
  
  # ROI và data augmentation
  roi_top_k_percent: 0.7
  average_trials_train: false  # Nếu true: average 3 trials -> 1 sample
  average_trials_val: true      # Thường set true cho validation
  augment_noise_train: true
  noise_std: 0.1
  
  # Optional: Concatenate train + val for final training
  concat_train_val: false  # Set true để dùng cả val data cho training
