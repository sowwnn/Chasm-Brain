# DiffusionARM Wide Configuration (Larger Hidden Dimension)

experiment:
  name: "diffusion_arm"
  version: "v1_wide"
  seed: 42
  save_dir: "outputs"

model:
  name: "DiffusionARM"
  input_dim: 768
  output_dim: 1000
  hidden_dim: 2048         # Wide model: larger hidden dimension for rich representations
  num_layers: 6            # Number of (ResBlock + CrossAttn) layers (renamed from num_res_blocks)
  num_heads: 8             # Multi-head attention heads
  dropout: 0.15            # Moderate dropout for wider model
  num_res_blocks: 4

  diffusion:
    timesteps: 50               # Conservative: Đủ cho 1D data
    inference_timesteps: 10     # DDIM inference với 10 steps
    clip_value: 3.0             # Phù hợp với data range [-2.36, 2.41]
    beta_schedule: "cosine"

  loss:
    type: "PeakFocusedLoss"
    alpha: 2.5             # Slightly reduce alpha for better balance
    tau: 0.5
    pearson_weight: 0.7    # Balance peak and correlation loss

data:
  datalist_path: "dataset/nsd/metadata/datalist_mindeye2_sub01.json"
  fmri_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm.hdf5"
  train_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_train_sub01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_test_sub01.npy"
  subjects: [1]
  batch_size: 32           # Reasonable batch size for wide model
  num_workers: 4
  augment_noise_train: true
  noise_std: 0.15          # Moderate noise augmentation
  use_parcellation: true
  parcel_labels_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm_kmeans1000_labels.npy"

training:
  max_epochs: 100
  lr: 1.0e-4             # Balanced learning rate
  weight_decay: 0.01     # Moderate weight decay
  precision: "16-mixed"
  gradient_clip_val: 1.0
  scheduler: "plateau"
  eval_sampling_every_n_batches: 10  # Hybrid training: Tính sampling metrics mỗi 10 batches

validation:
  monitor: "val/pearson"
  save_top_k: 3
  early_stopping_patience: 15  # Reasonable patience

logging:
  logger: "tensorboard"
  log_every_n_steps: 10
  visualize: true
  viz_every_n_epochs: 1
  viz_num_samples: 3

hardware:
  accelerator: "gpu"
  devices: 1
