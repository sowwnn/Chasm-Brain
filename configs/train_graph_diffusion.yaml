# Configuration for Graph Diffusion ARM Training
# Point Cloud + Graph Neural Network approach for fMRI prediction

experiment:
  name: "graph_diffusion"
  version: "v1_pointcloud"
  seed: 42
  save_dir: "outputs"

model:
  name: "DiffusionGraphARM"
  input_dim: 768              # DINOv2 ViT-L/14 embedding dimension
  output_dim: 15724           # Full voxel count (visual cortex)
  hidden_dim: 256             # Graph hidden features (base channel)
  time_dim: 256               # Time embedding dimension
  num_heads: 8                # Attention heads for GAT
  gnn_type: "gcn"             # Graph network type: "gat" or "gcn"
  dropout: 0.1                # Dropout rate for graph layers
  resume_path: "outputs/graph_diffusion/v1_pointcloud/checkpoints/best.pt"              # Đường dẫn checkpoint để resume (bỏ trống nếu không dùng)

  diffusion:
    timesteps: 500           # Total diffusion timesteps
    beta_schedule: "cosine"   # Noise schedule: "cosine" or "linear"
    ddim_steps: 20            # DDIM sampling steps for inference (faster)
    cfg_scale: 4.0            # Classifier-free guidance scale (1.0 = no guidance, 4.0-7.0 typical)
    cfg_dropout: 0.1          # CFG dropout probability during training

  loss:
    type: "DiffusionPeakFocusedLoss"
    alpha: 2.0                # Peak amplification factor (higher = more weight on peaks)
    tau: 0.3                  # Peak threshold (deviation from mean)
    pearson_weight: 0.7       # Pearson correlation loss weight (tăng để mô hình tập trung tối đa vào tương quan)
    diversity_weight: 3.0     # Diversity loss weight (prevents mode collapse)
    l1_weight: 0.3          # L1 sparsity regularization

data:
  # Data paths - UPDATE THESE TO YOUR PATHS
  datalist_path: "dataset/nsd/metadata/datalist_mindeye2_sub01.json"
  fmri_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm.hdf5"
  train_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_train_sub01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_test_sub01.npy"
  point_cloud_path: "data/fmri_point_cloud_graph_subj01.npz"

  # Optional parcellation (set to null to disable)
  parcel_labels_path: null    # e.g., "dataset/nsd/subj01/betas_all_subj01_fp32_renorm_kmeans1000_labels.npy"

  subjects: [1]               # List of subject IDs
  batch_size: 4               # Smaller batch size for graph models (memory intensive)
  num_workers: 4              # DataLoader workers

  # Trial averaging
  average_trials_train: false # Average 3 trials per image (training)
  average_trials_val: true    # Average 3 trials per image (validation)

  # Data augmentation
  augment_noise_train: true   # Add Gaussian noise to embeddings
  noise_std: 0.3              # Std of Gaussian noise
  augment_position_jitter: true  # Add position jitter to coordinates
  jitter_std: 0.01            # Std of position jitter (in normalized space [0,1])

  # Preprocessing
  apply_zscore_train: false   # Z-score normalize fMRI (training)
  apply_zscore_val: false     # Z-score normalize fMRI (validation)

training:
  max_epochs: 100             # Maximum training epochs
  lr: 5.0e-5                  # Learning rate (giảm để tránh model "nổ" quá nhanh)
  lr_min: 1.0e-6              # Minimum learning rate (for cosine annealing)
  weight_decay: 0.01          # AdamW weight decay
  precision: "16-mixed"       # Mixed precision: "16-mixed" or "fp32"
  gradient_clip_val: 1.0      # Gradient clipping value
  accumulate_grad_batches: 4  # Gradient accumulation steps (effective batch = batch_size * accumulate)

validation:
  early_stopping_patience: 20 # Early stopping patience (epochs)
  visualize_pointcloud: true  # Generate 3D point cloud visualizations
  viz_every_n_epochs: 1       # Visualization frequency (epochs)
  viz_num_samples: 2          # Number of samples to visualize per validation

# Additional notes:
# - For faster training, reduce timesteps to 500 and use ddim_steps=10 for inference
# - For better quality, increase hidden_dim to 512 and num_heads to 16 (requires more memory)
# - CFG scale: 1.0 (no guidance), 2-4 (mild), 4-7 (strong), >7 (very strong, may oversaturate)
# - Graph type: "gat" is recommended (learns edge weights), "gcn" is simpler but faster
