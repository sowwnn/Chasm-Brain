# ARMNet Training Configuration

experiment:
  name: "armnet_baseline"
  version: "v2_antioverfit"  # Version mới với các cải tiến chống overfitting
  seed: 42
  save_dir: "outputs"

model:
  name: "ARMNet"  # ARMNet | ARMSDE | DiffusionARM | FlowARM
  input_dim: 768
  output_dim: 1000  # Will be auto-detected from parcellation
  hidden_dim: 1024  # Giảm từ 2048 → 512 để tránh overfitting
  dropout: 0.4  # Tăng dropout từ 0.1 → 0.4
  loss:
    type: "PeakFocusedLoss"  # PeakFocusedLoss | FlowMatchingLoss
    alpha: 3.0
    tau: 0.5
    pearson_weight: 0.8  # Tăng từ 0.5 → 0.8 để ưu tiên correlation hơn

data:
  datalist_path: "dataset/nsd/metadata/datalist_mindeye2_sub01.json"
  fmri_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm.hdf5"
  train_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_train_sub01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_test_sub01.npy"
  subjects: [1]
  batch_size: 32
  num_workers: 4
  # Optional
  augment_noise_train: true
  noise_std: 0.3  # Tăng từ 0.1 → 0.3 để augmentation mạnh hơn
  use_parcellation: true
  parcel_labels_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm_kmeans1000_labels.npy"

training:
  max_epochs: 100
  lr: 1.0e-4
  weight_decay: 0.01  # Tăng từ 1e-5 → 0.01 để regularize mạnh hơn
  precision: "16-mixed"
  gradient_clip_val: 1.0
  scheduler: "plateau"  # Đổi từ cosine sang plateau

validation:
  monitor: "val/pearson"
  save_top_k: 3
  early_stopping_patience: 20  # Tăng từ 15 → 20 để training lâu hơn

logging:
  logger: "tensorboard"  # tensorboard | wandb | csv
  log_every_n_steps: 10
  visualize: true
  viz_every_n_epochs: 1
  viz_num_samples: 3

hardware:
  accelerator: "gpu"
  devices: 1
