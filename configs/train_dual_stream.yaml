# Dual-Stream CNN training configuration

experiment:
  name: "dual_stream_cnn"
  version: "v1"
  seed: 42
  save_dir: "outputs"

model:
  name: "DualStreamCNN"
  vis_dim: 768
  compact_shape: [61, 46, 42]
  n_voxels: 15724
  base_channels_3d: 32        # Tăng từ 16 -> 32 để model mạnh hơn
  base_channels_1d: 64        # Tăng từ 32 -> 64
  depths: [2, 2, 2, 2]        # Tăng từ [1,1,1,1] -> [2,2,2,2] để có nhiều layer hơn
  drop_path_rate: 0.1         # Tăng từ 0.0 -> 0.1 để regularization
  fusion_type: "mlp"
  fusion_dim: 128             # Tăng từ 64 -> 128 để fusion mạnh hơn

  loss:
    alpha: 1.0                # Giảm từ 10.0 -> 1.0 để cân bằng loss
    tau: 0.5
    pearson_weight: 1.0       # Tăng từ 0.1 -> 1.0 để ưu tiên pattern matching
    consistency_weight: 0.5   # Tăng từ 0.0 -> 0.5 để 2 stream nhất quán

data:
  datalist_path: "dataset/nsd/metadata/datalist_mindeye2_sub01.json"
  fmri_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm.hdf5"
  train_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_train_sub01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_test_sub01.npy"
  mapping_path: "/home/sowwn/Workspace/ws/2026/I2fMRI/data/fmri_3d_compact_mapping_subj01.npz"
  subjects: [1]
  batch_size: 16              # Tăng từ 8 -> 16 (nếu GPU đủ VRAM)
  num_workers: 4              # Tăng từ 0 -> 4 để tăng tốc data loading
  augment_noise_train: true   # Bật augmentation để tránh overfitting
  noise_std: 0.05             # Giảm từ 0.1 -> 0.05 để noise vừa phải
  use_parcellation: false
  parcel_labels_path: null

training:
  max_epochs: 50              # Tăng từ 2 -> 50 epochs
  lr: 5.0e-4                  # Tăng từ 1e-4 -> 5e-4 để học nhanh hơn
  weight_decay: 0.05          # Tăng từ 0.01 -> 0.05 để regularization mạnh hơn
  precision: "16-mixed"       # Đổi từ "32" -> "16-mixed" để tăng tốc và tiết kiệm VRAM
  gradient_clip_val: 1.0
  warmup_epochs: 5            # Thêm warmup để training ổn định
  scheduler: "cosine"         # Thêm cosine scheduler
  min_lr: 1.0e-6              # Learning rate tối thiểu

logging:
  visualize: true
  viz_every_n_epochs: 1       # Giảm tần suất từ 1 -> 5 để tiết kiệm thời gian
  viz_num_samples: 4          # Tăng từ 1 -> 4 để xem nhiều samples hơn
  log_every_n_steps: 50       # Thêm logging mỗi 50 steps

hardware:
  accelerator: "gpu"
  devices: 1                  # Thêm số lượng GPU