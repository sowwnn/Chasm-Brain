model:
  name: "HierarchicalARM"
  visual_dim: 768
  fmri_dim: 15724
  num_clusters: 518
  hidden_dim_1: 1024
  layers_1: 4
  hidden_dim_2: 2048
  layers_2: 6
  dropout: 0.2

training:
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.05
  max_epochs: 150
  precision: "fp16"
  save_dir: "checkpoints/hierarchical_subj01"
  vis_noise_std: 0.15
  # Training strategy parameters
  stage: 2             # 1 = Train Stage 1 only, 2 = Train Stage 2 (Stage 1 frozen)
  stage_1_epochs: 50   # How many epochs to train stage 1 if stage=1 (or sequential training)

loss:
  alpha: 2.0
  tau: 0.2
  pearson_weight: 0.8
  mse_weight: 1.0

data:
  subject: 1
  datalist_path: "dataset/nsd/metadata/datalist_mindeye2_sub01.json"
  fmri_path: "dataset/nsd/subj01/betas_all_subj01_fp32_renorm.hdf5"
  train_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_train_sub01.npy"
  test_embeddings_path: "dataset/nsd/embeddings_mindeye2/dinov2_test_sub01.npy"
  sub_roi_cluster_path: "data/sub_roi_labels.npy"
  average_trials_train: false
  average_trials_val: true
  augment_noise_train: true
  noise_std: 0.1
