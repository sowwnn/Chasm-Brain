# Variant B: TBEn readout as Stage 1, our Mamba Stage 2 unchanged.
# Identical to configs/train_hierarchical_v3_huwng.yaml apart from the Stage 1
# backbone, so this row isolates the effect of adding the refinement stage on
# top of the same structured readout used by Variant A.

model:
  name: "HierarchicalARM_TBEn_Both"
  cls_dim: 768
  patch_dim: 768
  num_patches: 256
  fmri_dim: 14278
  voxels_per_cluster: 30
  hidden_dim_1: 512
  depth_what: 2
  depth_where: 4
  contrastive_dim: 256
  embed_dim_2: 384
  depth_2: 6
  num_global_queries: 128
  dropout: 0.1
  # Same decoder as Variant A (authors' defaults); only the output head differs.
  tben_hidden_dim: 768
  tben_nheads: 16
  tben_dim_feedforward: 1024
  tben_enc_layers: 0
  tben_dec_layers: 1
  tben_pre_norm: true
  tben_enc_output_layer: 1

training:
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.01
  max_epochs: 450
  precision: "fp16"
  save_dir: "checkpoints/wacv_round2/tben_both/subj7_seed42"
  stage: 1
  stage_1_epochs: 150
  viz_interval: 5
  grad_clip: 0.5
  use_scheduler: true
  warmup_epochs: 15
  scheduler_type: "cosine"
  early_stopping: true
  patience: 10

loss:
  alpha: 2.0
  tau: 0.2
  pearson_weight: 0.3
  contrastive_weight: 0.2
  std_weight: 0.2
  peak_alpha: 0.5
  peak_tau: 0.3
  kl_weight: 0.001

experiment:
  backbone: "tben_both"
  guidance_mode: "predicted"
  vae_mode: "stochastic"
  seed: 42

data:
  subject: 7
  huwng_base_path: "dataset/huwng"
  train_embeddings_path: "dataset/huwng/subj07/nsd_dinov2_vitb14_multilayer_train_sub7.npy"
  test_embeddings_path: "dataset/huwng/subj07/nsd_dinov2_vitb14_multilayer_test_sub7.npy"
  roi_top_k_percent: 0.7
  average_trials_train: false
  average_trials_val: true
  augment_noise_train: true
  noise_std: 0.1
  concat_train_val: false
