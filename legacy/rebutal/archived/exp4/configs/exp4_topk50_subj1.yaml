# Exp 4 - Top-K% sensitivity (Subject 01) — STAGE 1 ONLY
# Variant: roi_top_k_percent = 0.5 (vs 0.70 default)
# Addresses xsi9 hyperparameter justification (Priority 3 in plan.md).

model:
  cls_dim: 768
  patch_dim: 768
  num_patches: 256
  voxels_per_cluster: 30
  hidden_dim_1: 512
  depth_what: 2
  depth_where: 4
  contrastive_dim: 256
  embed_dim_2: 384
  latent_dim: 128
  depth_2: 6
  num_global_queries: 128
  dropout: 0.4
  branch_mode: "both"
  subject_fmri_dims:
    1: 15724

training:
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.01
  stage_1_epochs: 150
  stage_2_epochs: 0
  precision: "fp16"
  save_dir: "rebutal/exp4/checkpoints/topk50_subj1"
  grad_clip: 0.5
  patience: 20
  viz_interval: 10

loss:
  peak_alpha: 0.5
  peak_tau: 0.3
  pearson_weight: 0.3
  std_weight: 0.2
  contrastive_weight: 0.2
  kl_weight: 0.001

data:
  huwng_base_path: "dataset/huwng"
  train_subjects: [1]
  dinov2_layer: -1
  roi_top_k_percent: 0.5
  average_trials_train: false
  average_trials_val: true
  augment_noise_train: true
  noise_std: 0.1
