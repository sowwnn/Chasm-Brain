# Exp 2 - Upper bound: train backbone + head on subj07 only (intra-subject)
# No Phase 2 adapt needed; final score = Val Pearson (subj07) at end of Stage 2.

model:
  cls_dim: 768
  patch_dim: 768
  num_patches: 256
  voxels_per_cluster: 30
  hidden_dim_1: 512
  depth_what: 2
  depth_where: 4
  contrastive_dim: 256
  embed_dim_2: 384
  latent_dim: 128
  depth_2: 6
  num_global_queries: 128
  dropout: 0.4

  subject_fmri_dims:
    7: 14278

training:
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.01
  stage_1_epochs: 150
  stage_2_epochs: 300
  precision: "fp16"
  save_dir: "rebutal/exp2/checkpoints/7-only/phase1"
  grad_clip: 0.5
  patience: 20
  viz_interval: 10

loss:
  peak_alpha: 0.5
  peak_tau: 0.3
  pearson_weight: 0.3
  std_weight: 0.2
  contrastive_weight: 0.2
  kl_weight: 0.001

data:
  huwng_base_path: "dataset/huwng"
  train_subjects: [7]
  dinov2_layer: -1
  roi_top_k_percent: 0.7
  average_trials_train: false
  average_trials_val: true
  augment_noise_train: true
  noise_std: 0.1

adapt:
  subject_id: 7
  fmri_dim: 14278
  epochs: 0
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 32
  save_dir: "rebutal/exp2/checkpoints/7-only/phase2"
  backbone_frozen: true
