model:
  name: "HierarchicalARM_V3_ConvNext"
  cls_dim: 1536
  patch_dim: 1536
  num_patches: 49
  fmri_dim: 15724
  voxels_per_cluster: 30
  hidden_dim_1: 768
  depth_what: 4
  depth_where: 6
  contrastive_dim: 256
  embed_dim_2: 512
  depth_2: 8
  num_global_queries: 128
  dropout: 0.4

training:
  batch_size: 16
  lr: 3.0e-5
  weight_decay: 0.01
  max_epochs: 50
  precision: "fp16"
  save_dir: "checkpoints/exp1c_convnext_large"
  stage: 1
  stage_1_epochs: 15
  viz_interval: 5
  grad_clip: 0.5
  use_scheduler: true
  warmup_epochs: 5
  scheduler_type: "cosine"
  early_stopping: true
  patience: 15

loss:
  alpha: 2.0
  tau: 0.2
  pearson_weight: 0.3
  contrastive_weight: 0.2
  std_weight: 0.2
  peak_alpha: 0.5
  peak_tau: 0.3

data:
  subject: 1
  huwng_base_path: "dataset/huwng"  # unused but required by loader
  train_embeddings_path: "dataset/nsd_raw_subj01/convnext_train.npy"
  test_embeddings_path: "dataset/nsd_raw_subj01/convnext_test.npy"
  train_fmri_path: "dataset/nsd_raw_subj01/fmri_train.npy"
  test_fmri_path: "dataset/nsd_raw_subj01/fmri_test.npy"
  roi_top_k_percent: 0.7
  average_trials_train: false
  average_trials_val: false  # already averaged in nsd_raw pipeline
  augment_noise_train: true
  noise_std: 0.1
  concat_train_val: false
